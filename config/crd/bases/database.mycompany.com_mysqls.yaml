---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: mysqls.database.mycompany.com
spec:
  group: database.mycompany.com
  names:
    kind: MySQL
    listKind: MySQLList
    plural: mysqls
    singular: mysql
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .status.primaryPodName
      name: Primary
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: MySQL is the Schema for the mysqls API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: MySQLSpec defines the desired state of MySQL
            properties:
              maintenanceWindow:
                description: |-
                  MaintenanceWindow is the daily UTC window when pin-driven (channel map) upgrades may roll the StatefulSet.
                  If unset, pin-driven upgrades are deferred until a window is configured (safe default).
                  Explicit Spec pin changes (customer-initiated) are applied immediately.
                properties:
                  end:
                    description: |-
                      End is the window end in UTC as HH:MM (24h). Example: "04:00"
                      Windows that cross midnight are supported (e.g. start 23:00, end 01:00).
                    pattern: ^([01]\d|2[0-3]):[0-5]\d$
                    type: string
                  start:
                    description: 'Start is the window start in UTC as HH:MM (24h).
                      Example: "02:00"'
                    pattern: ^([01]\d|2[0-3]):[0-5]\d$
                    type: string
                required:
                - end
                - start
                type: object
              replicas:
                description: Replicas is the number of MySQL pods (1 = single instance,
                  2 = primary/standby for failover).
                format: int32
                maximum: 2
                minimum: 1
                type: integer
              rootPassword:
                description: RootPassword for MySQL root user (should reference a
                  secret in production)
                type: string
              storageSize:
                description: StorageSize for the MySQL data volume (e.g., "10Gi")
                type: string
              version:
                description: |-
                  Version is the MySQL image tag: a channel (e.g. "8.4", "8.0") or a pin (e.g. "8.4.13").
                  Channels are resolved via the Offering-owned channel pins ConfigMap to a concrete patch tag.
                  Prefer not to use "latest". Image form: mysql:<resolved-tag>.
                type: string
            required:
            - storageSize
            - version
            type: object
          status:
            description: MySQLStatus defines the observed state of MySQL
            properties:
              message:
                description: Message provides additional information about the current
                  state
                type: string
              phase:
                description: |-
                  Phase represents the current state of the MySQL instance
                  Possible values: Pending, Running, Failed
                type: string
              primaryPodName:
                description: |-
                  PrimaryPodName is the name of the pod currently designated as primary (for HA with 2 replicas).
                  Used by the failover controller to route the primary Service and to decide failover target.
                type: string
              ready:
                description: Ready indicates whether the MySQL instance is ready to
                  accept connections
                type: boolean
              resolvedImage:
                description: ResolvedImage is the concrete container image the operator
                  is reconciling toward (e.g. mysql:8.4.13).
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
