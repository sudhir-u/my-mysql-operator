apiVersion: database.mycompany.com/v1alpha1
kind: MySQL
metadata:
  name: my-mysql-8.4.x
  namespace: default
spec:
  version: "8.4"
  storageSize: "2Gi"
  rootPassword: "mysecretnewpassword"
  # Pin-driven upgrades (from config/mysql-channel-pins.yaml) apply only in this UTC window.
  maintenanceWindow:
    start: "02:00"
    end: "04:00"